name: Package Claude PFD Generator

# Publishes the PFD generator ZIP for installation in Claude.ai.
# The stable release tag keeps existing download links working.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/package-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package PFD generator
        run: |
          mkdir -p dist
          cd skills
          zip -r "../dist/pfd-generator.zip" pfd-generator -x '*.DS_Store' '*__pycache__*'

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view skills-latest >/dev/null 2>&1; then
            gh release upload skills-latest dist/pfd-generator.zip --clobber
            gh release edit skills-latest --title "Claude PFD Generator" --notes "Download pfd-generator.zip and follow the README installation steps."
          else
            gh release create skills-latest dist/pfd-generator.zip \
              --title "Claude PFD Generator" \
              --notes "Download pfd-generator.zip and follow the README installation steps."
          fi
